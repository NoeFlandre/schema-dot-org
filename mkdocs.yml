site_name: wdcgeo
site_description: Geolocated text in the Web Data Commons schema.org GeoCoordinates subset
repo_url: https://github.com/NoeFlandre/schema-dot-org
repo_name: NoeFlandre/schema-dot-org

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy

nav:
  - Overview: index.md
  - The corpus: corpus.md
  - Findings: findings.md
  - Using the tools: usage.md
  - Design and quality: design.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
